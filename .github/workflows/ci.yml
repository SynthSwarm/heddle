name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing in this workflow writes to the repository, and the default
# permission set is whatever the org happens to hand out -- which on many is
# read/write. Declaring it here means a compromised build script in the ~700-crate
# dependency tree cannot push.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# A push that supersedes an earlier one cancels it. Without this a stale run keeps a
# runner busy building a commit nobody cares about any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs rather than tags. `@v4` is a tag the upstream owner
# can move, and `dtolnay/rust-toolchain@stable` was not even a tag -- it is a branch, so
# a force-push to it executed in every job here. Pinning to a SHA is the only form of
# `uses:` that says what it will run. The trailing comment is the human-readable version
# and is what dependabot rewrites when it bumps the pin.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `toolchain` is explicit because the SHA pin loses the branch name that used to
      # select it: on `master` the input is `required: true`.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      # `--locked` throughout, so a Cargo.toml edited without regenerating the lockfile
      # fails here rather than resolving to something nobody has built.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Split out rather than tacked onto `check`. The release profile shares no artefacts
  # with the debug builds clippy and test produce, so running it in sequence added a
  # third full compile of the matrix-sdk tree to the critical path. In parallel it costs
  # wall-clock nothing.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release
        run: cargo build --release --locked

  # The musl target ships in every release but was previously only ever built at tag
  # time, which is the worst moment to discover that the cross-compile broke. `check`
  # rather than `build`: this exists to catch a `bundled-sqlite` or cc-rs failure, and
  # linking the binary again buys nothing the release job does not already do.
  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Check musl
        run: cargo check --workspace --locked --target x86_64-unknown-linux-musl

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `--all-targets`, so the floor covers test and bench code too. Checking only the
      # library let a test module use a newer API and still pass.
      - name: Check MSRV
        run: cargo check --workspace --all-targets --locked

  # The opencode plugin is the only producer of `dev.heddle.agent.v1`, and it is
  # TypeScript in an otherwise Rust repository -- so `cargo test` being green stopped
  # meaning "everything is green" the moment it landed.
  #
  # This job exists for the seam rather than for the plugin. The fixtures under
  # `plugins/opencode/test/fixtures` are recordings of the emitter which
  # `crates/heddle-agent/tests/conformance.rs` reads back, so the two sides can only
  # drift if someone changes the emitter and does not regenerate them. Regenerating here
  # and failing on a diff is what turns that from a convention into a check.
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/opencode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/opencode/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is the point, and an install
      # that quietly resolves something newer would test a tree nobody has.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Regenerates from the emitter and diffs against what is committed. A failure here
      # is not "the fixtures are wrong" -- it is "the emitter changed and the recordings
      # no longer match it", which is exactly the drift the Rust test cannot see.
      - name: Fixtures are current
        run: node test/fixtures.mjs --check
