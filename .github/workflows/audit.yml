name: audit

# Advisories are published after your last commit, so a push-triggered audit goes stale
# the moment it passes. The schedule is the point of this workflow; the other two
# triggers just stop a dependency change from landing unexamined.
on:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `issues: write` and `checks: write` are scoped to the job rather than the
    # workflow, and only for the triggers that can use them. On a fork's pull request
    # the token is read-only regardless, so the action can only ever report through the
    # step's own exit status there.
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # This client holds an access token and every Megolm key the device has seen. A
      # vulnerable dependency is not an abstract problem here, and the whole tree is
      # third-party crypto and networking.
      #
      # `@v2` here was a *branch*, not a tag -- upstream never published a v2 tag -- so
      # every run executed whatever its head pointed at. Pinned; see the note in ci.yml.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2 branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
