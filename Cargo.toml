[workspace]
resolver = "2"
members = [
    "crates/heddle-matrix",
    "crates/heddle-agent",
    "crates/heddle-render",
    "crates/heddle-layout",
    "crates/heddle-app",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# The floor is set by matrix-sdk 0.18, which requires 1.93. Declaring anything lower
# is a fiction: the workspace has never built on it.
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/SynthSwarm/heddle"
homepage = "https://github.com/SynthSwarm/heddle"
authors = ["Quintin"]
readme = "README.md"
keywords = ["matrix", "tui", "agent", "chat", "ratatui"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
heddle-matrix = { path = "crates/heddle-matrix" }
heddle-agent = { path = "crates/heddle-agent" }
heddle-render = { path = "crates/heddle-render" }
heddle-layout = { path = "crates/heddle-layout" }

# Matrix. `bundled-sqlite` avoids a system libsqlite3 build dependency, keeping the
# binary self-contained. TLS is handled internally by the SDK as of 0.18.
matrix-sdk = { version = "0.18.0", features = [
    "e2e-encryption",
    "sqlite",
    "bundled-sqlite",
    "markdown",
    "socks",
] }
matrix-sdk-ui = { version = "0.18.0" }

# TUI
# `unstable-rendered-line-info` gates Paragraph::line_count, which is the only way to
# learn how many rows a transcript wrapped to at a given width. Scroll clamping needs
# that number; the alternative is reimplementing ratatui's wrap algorithm here and
# having it drift silently. One call site, in ui::draw_panes.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
# `serde` is what makes layout persistence possible without a hand-rolled tree format:
# the crate serialises its own `Node`, and `set_root` revalidates and renumbers on the
# way back in, so a corrupt or hand-edited file is rejected rather than trusted.
ratatui-hypertile = { version = "0.4.1", features = ["serde"] }
tui-markdown = { version = "0.3.9", features = ["highlight-code"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.12.0"

# Core
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures-util = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "0.9.8"
anyhow = "1.0.104"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
directories = "6.0.0"
clap = { version = "4.6.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# The matrix SDK dependency tree is large; optimising deps keeps the TUI usable
# in debug builds without paying full release compile times on our own crates.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
